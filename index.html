<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Office Fit-Out Project Tracker</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f5f6f8;--card:#fff;--tx:#1b2430;--mu:#667085;--bd:#e1e5ea;--ac:#1f6feb;--ok:#1a9b55;--wn:#d98a00;--er:#d92d20;--gy:#8a94a3}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161c;--card:#1b212a;--tx:#e8ecf1;--mu:#98a2b3;--bd:#2d3643;--ac:#5b9bff;--ok:#38c172;--wn:#f0a92b;--er:#f2665a}}
:root[data-theme="dark"]{--bg:#12161c;--card:#1b212a;--tx:#e8ecf1;--mu:#98a2b3;--bd:#2d3643;--ac:#5b9bff;--ok:#38c172;--wn:#f0a92b;--er:#f2665a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{padding:14px 16px 0;max-width:1100px;margin:auto}
h1{font-size:19px;margin:0}.sub{color:var(--mu);font-size:12px}
nav{display:flex;gap:4px;margin-top:10px;overflow-x:auto;border-bottom:1px solid var(--bd)}
nav button{background:none;border:0;border-bottom:3px solid transparent;padding:9px 14px;color:var(--mu);font:inherit;font-weight:600;cursor:pointer;white-space:nowrap}
nav button.on{color:var(--ac);border-color:var(--ac)}
main{max-width:1100px;margin:auto;padding:14px 16px 60px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px 14px;margin-bottom:12px}
.grid .card{margin:0}.big{font-size:26px;font-weight:700}.lbl{color:var(--mu);font-size:12px}
.bar{height:8px;background:var(--bd);border-radius:5px;overflow:hidden;min-width:70px}.bar i{display:block;height:100%;background:var(--ac)}
.bar.exp{position:relative}
.chip{display:inline-block;padding:1px 8px;border-radius:10px;font-size:11px;font-weight:700;color:#fff;background:var(--gy)}
.Delivered,.Done,.Verified,.Fixed{background:var(--ok)}.On.track,.On\ track{background:var(--ac)}.transit{background:var(--ac)}.Behind,.Medium,.In\ Progress{background:var(--wn)}.Delayed,.Critical,.High,.Open{background:var(--er)}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--bd);vertical-align:middle}th{color:var(--mu);font-size:11px;text-transform:uppercase}
.wrap{overflow-x:auto}
button.b,select,input,textarea{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:7px;padding:6px 10px}
button.b{cursor:pointer;font-weight:600}button.p{background:var(--ac);color:#fff;border-color:var(--ac)}button.d{color:var(--er)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.sp{flex:1}
h3{margin:16px 0 6px;font-size:14px}
.th{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}.th img{width:56px;height:56px;object-fit:cover;border-radius:6px;border:1px solid var(--bd)}
.th a.pdf{display:inline-block;padding:6px 8px;border:1px solid var(--bd);border-radius:6px;font-size:12px;color:var(--ac);text-decoration:none}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:16px;z-index:9}
#md{background:var(--card);border-radius:12px;padding:16px;width:100%;max-width:520px;margin:auto}
#md label{display:block;font-size:12px;color:var(--mu);margin-top:9px}#md input,#md select,#md textarea{width:100%;box-sizing:border-box}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.empty{text-align:center;color:var(--mu);padding:30px}
@media print{nav,.row,button{display:none!important}body{background:#fff}}
</style></head><body>
<header><h1>🏗️ Office Fit-Out — Project Track &amp; Control</h1><div class="sub" id="sub">Loading…</div><button class="b" id="lg" onclick="authBtn()" style="margin-top:6px">Staff login</button>
<nav id="nav"></nav></header><main id="main"></main>
<div id="ov"><div id="md"></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.min.js"></script>
<script>
const SEED={"Civil Works":["Block works","Plaster work","Tiles bedding","Tiles fixing","Sewerage lines (Pantry & Dine-in)"],
"Finishing":["Ceiling putty","Wall putty","Ceiling paint","Wall paint","LVT flooring"],
"Sound Proofing":["Audio studio sound proofing"],
"Electrical":["Electrical wiring","Electrical fittings"],
"Plumbing":["Water pipe laying","Sanitary fittings (Dine-in & Pantry)"],
"Aluminium & Glass":["Aluminium partitions","Glass doors","Main entry door","Meeting room partitions","Lounge partitions","Other door fixing"],
"HVAC":["AC ducting","AC split units fixing"],
"Safety & IT":["Fire safety system","Network cabling & connections","CCTV supply & installation"],
"Furniture":["Aluminium racks (store)","Office workstations","Manager tables","Reception desk","Reception sofa & centre table","Silent booths","Brainstorming area"]};
const MST=["Ordered","In transit","Delivered"],G={Done:"--ok","On track":"--ac",Behind:"--wn",Delayed:"--er","Not started":"--gy"};
const ISSUE_TYPES=["Quality","Delay","Improper installation","Finishing defect","Safety","Material","Other"];
const SEV=["Low","Medium","High","Critical"],IST=["Open","In Progress","Fixed","Verified"];
let db,assets,user,canW=false,tab="dash",tasks=[],issues=[],mats=[],ftCat="",ftSt="",fiSt="",tmp=null;
const $=id=>document.getElementById(id),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const today=new Date().toISOString().slice(0,10),D=s=>s?new Date(s+"T00:00:00").getTime():NaN;
function expected(t){const a=D(t.start),b=D(t.end),n=D(today);if(isNaN(a)||isNaN(b)||b<=a)return null;return Math.max(0,Math.min(100,(n-a)/(b-a)*100))}
function status(t){const p=+t.progress||0;if(p>=100)return"Done";const a=D(t.start),b=D(t.end),n=D(today);if(p===0&&(isNaN(a)||n<a))return"Not started";if(!isNaN(b)&&n>b)return"Delayed";const e=expected(t);if(e!==null&&e-p>15)return"Behind";return"On track"}
const days=t=>{const b=D(t.end);return isNaN(b)?0:Math.round((D(today)-b)/864e5)};
function overall(list){let w=0,s=0;list.forEach(t=>{const x=+t.weight||1;w+=x;s+=x*(+t.progress||0)});return w?Math.round(s/w):0}
function cats(){return[...new Set(tasks.map(t=>t.cat))].sort()}
const bar=p=>`<div class="bar"><i style="width:${p}%"></i></div>`;
const chip=s=>`<span class="chip ${esc(s)}">${esc(s)}</span>`;
function att(a){return(a||[]).length?`<div class="th">${a.map(f=>/^image/.test(f.type)?`<a href="${f.url}" target="_blank"><img src="${f.url}" alt=""></a>`:`<a class="pdf" href="${f.url}" target="_blank">📄 ${esc(f.name||"PDF")}</a>`).join("")}</div>`:""}
function nav(){const T=[["dash","Dashboard"],["tasks","Work Items"],["gantt","Timeline"],["mat","Materials"],["issues","QC & Issues"],["rep","Reports"]];
$("nav").innerHTML=T.map(([k,v])=>`<button class="${tab===k?"on":""}" onclick="tab='${k}';render()">${v}${k==="issues"?" ("+issues.filter(i=>i.status!=="Verified").length+")":""}</button>`).join("")}
function render(){nav();$("lg").textContent=canW?"Log out":"Staff login";$("sub").textContent=`Updated ${new Date().toLocaleString()} · ${canW?"Edit access":"View only · tap 💬 to comment"} · Overall ${overall(tasks)}%`;
$("main").innerHTML={dash,tasks:tasksV,gantt,mat:matV,issues:issuesV,rep}[tab]()}
function dash(){if(!tasks.length)return`<div class="card empty">No work items yet.<br><br>${canW?`<button class="b p" onclick="seed()">Load standard fit-out work list</button>`:"The site supervisor has not added items yet."}</div>`;
const st=tasks.map(status),late=tasks.filter(t=>status(t)==="Delayed"),open=issues.filter(i=>i.status!=="Verified");
const crit=open.filter(i=>i.severity==="Critical"||i.severity==="High").length;
const ex=tasks.filter(t=>expected(t)!==null);const exp=ex.length?Math.round(ex.reduce((a,t)=>a+expected(t),0)/ex.length):null;
return`<div class="grid"><div class="card"><div class="lbl">Overall progress</div><div class="big">${overall(tasks)}%</div>${bar(overall(tasks))}<div class="lbl">${exp===null?"Set dates for plan":"Planned by today: "+exp+"%"}</div></div>
<div class="card"><div class="lbl">Completed</div><div class="big">${st.filter(s=>s==="Done").length}/${tasks.length}</div></div>
<div class="card"><div class="lbl">Delayed items</div><div class="big" style="color:var(--er)">${late.length}</div></div>
<div class="card"><div class="lbl">Open issues</div><div class="big">${open.length}</div><div class="lbl">${crit} high / critical</div></div></div>
<div class="card"><h3 style="margin-top:0">Progress by category</h3><div class="wrap"><table>${cats().map(c=>{const l=tasks.filter(t=>t.cat===c);const d=l.filter(t=>status(t)==="Delayed").length;return`<tr><td>${esc(c)}</td><td style="width:40%">${bar(overall(l))}</td><td><b>${overall(l)}%</b></td><td>${d?`<span class="chip Delayed">${d} delayed</span>`:""}</td></tr>`}).join("")}</table></div></div>
<div class="card"><h3 style="margin-top:0">⚠ Delay highlights</h3>${late.length?`<div class="wrap"><table>${late.sort((a,b)=>days(b)-days(a)).map(t=>`<tr><td>${esc(t.name)}<div class="lbl">${esc(t.cat)}${t.contractor?" · "+esc(t.contractor):""}</div></td><td>${t.progress||0}%</td><td style="color:var(--er)"><b>${days(t)} days late</b></td><td>${esc(t.delayReason||"")}</td></tr>`).join("")}</table></div>`:`<div class="lbl">No delayed items 🎉</div>`}</div>
<div class="card"><h3 style="margin-top:0">Open critical / high issues</h3>${open.filter(i=>["Critical","High"].includes(i.severity)).map(issueCard).join("")||`<div class="lbl">None</div>`}</div>`}
function tasksV(){const L=tasks.filter(t=>(!ftCat||t.cat===ftCat)&&(!ftSt||status(t)===ftSt));
const sel=(v,arr,fn)=>`<select onchange="${fn}=this.value;render()"><option value="">All</option>${arr.map(a=>`<option ${a===v?"selected":""}>${esc(a)}</option>`).join("")}</select>`;
return`<div class="row">${sel(ftCat,cats(),"ftCat")}${sel(ftSt,["Not started","On track","Behind","Delayed","Done"],"ftSt")}<span class="sp"></span>${canW?`<button class="b" onclick="seed()">+ Load standard list</button><button class="b p" onclick="openForm('tasks')">+ Add item</button>`:""}</div>`+
(L.length?cats().filter(c=>L.some(t=>t.cat===c)).map(c=>`<div class="card"><h3 style="margin-top:0">${esc(c)} — ${overall(L.filter(t=>t.cat===c))}%</h3><div class="wrap"><table><tr><th>Item</th><th>Plan</th><th>Progress</th><th>Status</th><th></th></tr>${L.filter(t=>t.cat===c).map(t=>`<tr><td>${esc(t.name)}${t.contractor?`<div class="lbl">👷 ${esc(t.contractor)}</div>`:""}${t.notes?`<div class="lbl">${esc(t.notes)}</div>`:""}${att(t.files)}</td><td class="lbl">${esc(t.start||"–")}<br>${esc(t.end||"–")}</td><td style="min-width:90px">${bar(t.progress||0)}${t.progress||0}%</td><td>${chip(status(t))}</td><td>${cmBtn('tasks',t._id)}${canW?`<button class="b" onclick="openForm('tasks','${t._id}')">Edit</button>`:""}</td></tr>`).join("")}</table></div></div>`).join(""):`<div class="card empty">No items match.</div>`)}
function issueCard(i){const t=tasks.find(x=>x._id===i.taskId);return`<div class="card" style="margin-bottom:8px"><div class="row" style="margin:0">${chip(i.severity)}${chip(i.status)}<b>${esc(i.title)}</b><span class="sp"></span>${cmBtn('issues',i._id)}${canW?`<button class="b" onclick="openForm('issues','${i._id}')">Edit</button>`:""}</div><div class="lbl">${esc(i.type)} · ${esc(i.location||"")}${t?" · "+esc(t.name):""} · Reported ${esc(i.date||"")}${i.due?" · Fix by "+esc(i.due):""}${i.due&&i.due<today&&!["Fixed","Verified"].includes(i.status)?' <b style="color:var(--er)">OVERDUE</b>':""}</div>${i.desc?`<div>${esc(i.desc)}</div>`:""}${i.action?`<div class="lbl">Corrective action: ${esc(i.action)}</div>`:""}${att(i.files)}</div>`}
function issuesV(){const L=issues.filter(i=>!fiSt||i.status===fiSt).sort((a,b)=>SEV.indexOf(b.severity)-SEV.indexOf(a.severity));
return`<div class="row"><select onchange="fiSt=this.value;render()"><option value="">All status</option>${IST.map(s=>`<option ${s===fiSt?"selected":""}>${s}</option>`).join("")}</select><span class="sp"></span>${canW?`<button class="b p" onclick="openForm('issues')">+ Log issue</button>`:""}</div>${L.map(issueCard).join("")||`<div class="card empty">No issues logged.</div>`}`}
function rep(){const open=issues.filter(i=>i.status!=="Verified");
return`<div class="row"><b>Progress report — ${today}</b><span class="sp"></span><button class="b" onclick="csv()">⬇ Download CSV</button><button class="b" onclick="window.print()">🖨 Print / PDF</button></div>`+weekly()+dash()+contr()+
`<div class="card"><h3 style="margin-top:0">All items</h3><div class="wrap"><table><tr><th>Category</th><th>Item</th><th>Plan end</th><th>%</th><th>Status</th></tr>${tasks.map(t=>`<tr><td>${esc(t.cat)}</td><td>${esc(t.name)}</td><td>${esc(t.end||"–")}</td><td>${t.progress||0}</td><td>${chip(status(t))}</td></tr>`).join("")}</table></div></div>
<div class="card"><h3 style="margin-top:0">Issues by type (open: ${open.length})</h3>${ISSUE_TYPES.map(k=>{const n=open.filter(i=>i.type===k).length;return n?`<div>${k}: <b>${n}</b></div>`:""}).join("")||"None"}</div>`}

const matSt=m=>m.status!=="Delivered"&&m.eta&&m.eta<today?"Delayed":(m.status||"Ordered");
function gantt(){const L=tasks.filter(t=>t.start&&t.end&&D(t.end)>=D(t.start));
if(!L.length)return`<div class="card empty">Enter planned start and finish dates in Work Items to see the timeline.</div>`;
const a=Math.min(...L.map(t=>D(t.start))),b=Math.max(...L.map(t=>D(t.end)),D(today)),sp=b-a||1,pc=x=>(x-a)/sp*100,fd=x=>new Date(x).toISOString().slice(0,10);
const td=pc(D(today));
return`<div class="card"><div class="lbl">${fd(a)} → ${fd(b)} · red line = today · bar fill = actual progress</div><div class="wrap"><div style="min-width:680px">`+cats().filter(c=>L.some(t=>t.cat===c)).map(c=>`<h3>${esc(c)}</h3>`+L.filter(t=>t.cat===c).map(t=>{const s=status(t),l=pc(D(t.start)),w=Math.max(1,pc(D(t.end))-l);
return`<div style="display:flex;align-items:center;border-bottom:1px solid var(--bd)"><div style="width:170px;flex:none;font-size:12px;padding:4px 6px 4px 0">${esc(t.name)}</div><div style="position:relative;flex:1;height:24px"><div style="position:absolute;left:${td}%;top:0;bottom:0;border-left:2px solid var(--er)"></div><div style="position:absolute;left:${l}%;width:${w}%;top:5px;height:14px;border-radius:4px;background:var(--bd);outline:1px solid var(${G[s]});overflow:hidden"><i style="display:block;height:100%;width:${t.progress||0}%;background:var(${G[s]})"></i></div></div></div>`}).join("")).join("")+`</div></div></div>`}
function matV(){const L=mats.slice().sort((x,y)=>(x.eta||"9").localeCompare(y.eta||"9"));
return`<div class="row"><span class="lbl">Track material orders and deliveries against the work they are needed for.</span><span class="sp"></span>${canW?`<button class="b p" onclick="openForm('materials')">+ Add material</button>`:""}</div>`+(L.length?`<div class="card wrap"><table><tr><th>Material</th><th>Supplier</th><th>Qty</th><th>Expected</th><th>Status</th><th></th></tr>${L.map(m=>{const t=tasks.find(x=>x._id===m.taskId);return`<tr><td>${esc(m.name)}${t?`<div class="lbl">for ${esc(t.name)}</div>`:""}${m.notes?`<div class="lbl">${esc(m.notes)}</div>`:""}${att(m.files)}</td><td>${esc(m.supplier||"")}</td><td>${esc(m.qty||"")}</td><td>${esc(m.eta||"–")}</td><td>${chip(matSt(m))}</td><td>${cmBtn('materials',m._id)}${canW?`<button class="b" onclick="openForm('materials','${m._id}')">Edit</button>`:""}</td></tr>`}).join("")}</table></div>`:`<div class="card empty">No materials logged yet.</div>`)}
function weekly(){const w=new Date(Date.now()-7*864e5).toISOString().slice(0,10),n=new Date(Date.now()+7*864e5).toISOString().slice(0,10);
const up=tasks.filter(t=>t.upd>=w),ni=issues.filter(i=>i.date>=w),nx=tasks.filter(t=>t.end>=today&&t.end<=n&&status(t)!=="Done"),md=mats.filter(m=>m.status!=="Delivered"&&m.eta&&m.eta<=n);
const L=(a,f)=>a.length?a.map(f).join(""):`<div class="lbl">None</div>`;
return`<div class="card"><h3 style="margin-top:0">📅 Weekly report: ${w} to ${today}</h3><b>Updated this week</b>${L(up,t=>`<div>• ${esc(t.name)} — ${t.progress||0}%${t.notes?" · "+esc(t.notes):""}</div>`)}<br><b>New issues (${ni.length})</b>${L(ni,i=>`<div>• ${esc(i.title)} [${esc(i.severity)}, ${esc(i.status)}]</div>`)}<br><b>Due to finish in next 7 days</b>${L(nx,t=>`<div>• ${esc(t.name)} — ${esc(t.end)} (${t.progress||0}%)</div>`)}<br><b>Materials due / overdue</b>${L(md,m=>`<div>• ${esc(m.name)} — ${esc(m.eta)} ${chip(matSt(m))}</div>`)}</div>`}
function contr(){const g={};tasks.forEach(t=>{const k=t.contractor||"Unassigned";(g[k]=g[k]||[]).push(t)});
return`<div class="card"><h3 style="margin-top:0">By subcontractor</h3><div class="wrap"><table><tr><th>Subcontractor</th><th>Items</th><th>Progress</th><th>Delayed</th></tr>${Object.keys(g).sort().map(k=>`<tr><td>${esc(k)}</td><td>${g[k].length}</td><td>${overall(g[k])}%</td><td>${g[k].filter(t=>status(t)==="Delayed").length}</td></tr>`).join("")}</table></div></div>`}
async function csv(){const r=[["Category","Item","Start","End","Progress","Status","Notes","Subcontractor"],...tasks.map(t=>[t.cat,t.name,t.start,t.end,t.progress||0,status(t),t.notes||"",t.contractor||""])];
const data=r.map(x=>x.map(v=>'"'+String(v??"").replace(/"/g,'""')+'"').join(",")).join("\n");
const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([data],{type:"text/csv"}));a.download="progress-"+today+".csv";a.click()}
async function seed(){if(!canW)return;if(tasks.length&&!confirm("Add standard list to existing items?"))return;
let n=0;for(const c in SEED)for(const nm of SEED[c]){await db.collection("tasks").doc("k"+Date.now()+(n++)).set({cat:c,name:nm,progress:0,weight:1,start:"",end:"",files:[]})}}
function openForm(kind,id){const o=({tasks,issues,materials:mats})[kind].find(x=>x._id===id)||{};tmp=(o.files||[]).slice();const T=kind==="tasks";
const opt=(a,v)=>a.map(x=>`<option ${x===v?"selected":""}>${esc(x)}</option>`).join("");
$("md").innerHTML=`<h3 style="margin-top:0">${id?"Edit":"New"} ${T?"work item":kind==="materials"?"material":"issue"}</h3>`+(T?
`<label>Category</label><input id="f_cat" list="cl" value="${esc(o.cat||"")}"><datalist id="cl">${cats().map(c=>`<option>${esc(c)}`).join("")}</datalist>
<label>Item name</label><input id="f_name" value="${esc(o.name||"")}"><label>Subcontractor / team</label><input id="f_contractor" value="${esc(o.contractor||"")}">
<div class="two"><div><label>Planned start</label><input type="date" id="f_start" value="${o.start||""}"></div><div><label>Planned finish</label><input type="date" id="f_end" value="${o.end||""}"></div></div>
<div class="two"><div><label>Progress % <b id="pv">${o.progress||0}</b></label><input type="range" id="f_progress" min="0" max="100" step="5" value="${o.progress||0}" oninput="pv.textContent=this.value"></div><div><label>Weight (importance)</label><input type="number" id="f_weight" min="1" value="${o.weight||1}"></div></div>
<label>Notes / site update</label><textarea id="f_notes" rows="3">${esc(o.notes||"")}</textarea><label>Reason for delay</label><input id="f_delayReason" value="${esc(o.delayReason||"")}">`:kind==="materials"?`<label>Material / item</label><input id="f_mname" value="${esc(o.name||"")}"><div class="two"><div><label>Supplier</label><input id="f_supplier" value="${esc(o.supplier||"")}"></div><div><label>Quantity</label><input id="f_qty" value="${esc(o.qty||"")}"></div></div><div class="two"><div><label>Expected delivery</label><input type="date" id="f_eta" value="${o.eta||""}"></div><div><label>Status</label><select id="f_mstatus">${opt(MST,o.status||"Ordered")}</select></div></div><label>Needed for work item</label><select id="f_taskId"><option value="">—</option>${tasks.map(t=>`<option value="${t._id}" ${t._id===o.taskId?"selected":""}>${esc(t.name)}</option>`).join("")}</select><label>Notes</label><textarea id="f_notes" rows="2">${esc(o.notes||"")}</textarea>`:
`<label>Title</label><input id="f_title" value="${esc(o.title||"")}">
<div class="two"><div><label>Type</label><select id="f_type">${opt(ISSUE_TYPES,o.type)}</select></div><div><label>Severity</label><select id="f_severity">${opt(SEV,o.severity||"Medium")}</select></div></div>
<div class="two"><div><label>Status</label><select id="f_status">${opt(IST,o.status||"Open")}</select></div><div><label>Fix-by date</label><input type="date" id="f_due" value="${o.due||""}"></div></div>

function fl(){const e=$("fl");if(!e)return;e.innerHTML=att(tmp)+(tmp.length?`<button class="b" onclick="tmp=[];fl()">Remove all attachments</button>`:"")}
async function upl(inp){if(!assets){alert("Uploads not available");return}$("fl").textContent="Uploading…";
for(const f of inp.files){try{const r=await assets.upload(f);tmp.push({id:r.id,url:r.url,type:f.type,name:f.name})}catch(e){alert("Upload failed: "+(e.message||e.code))}}fl()}
async function save(kind,id){const F=k=>$("f_"+k)?.value;const d={files:tmp};
if(kind==="tasks")Object.assign(d,{cat:F("cat")||"General",name:F("name"),contractor:F("contractor"),upd:today,start:F("start"),end:F("end"),progress:+F("progress"),weight:+F("weight")||1,notes:F("notes"),delayReason:F("delayReason")});
else if(kind==="materials")Object.assign(d,{name:F("mname"),supplier:F("supplier"),qty:F("qty"),eta:F("eta"),status:F("mstatus"),taskId:F("taskId"),notes:F("notes")});else{Object.assign(d,{title:F("title"),type:F("type"),severity:F("severity"),status:F("status"),due:F("due"),location:F("location"),taskId:F("taskId"),desc:F("desc"),action:F("action")});const o=issues.find(x=>x._id===id);d.date=o?.date||today}
if(!(d.name||d.title)){alert("Please enter a name");return}
try{await db.collection(kind).doc(id||"k"+Date.now()).set(d);$("ov").style.display="none"}catch(e){noWrite(e,"Save failed")}}
async function del(kind,id){if(confirm("Delete permanently?"))try{await db.collection(kind).doc(id).delete();$("ov").style.display="none"}catch(e){noWrite(0,"Delete failed")}}
